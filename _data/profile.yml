short_bio_text_justify: false
short_bio: >-
  <p>
    I am a PhD Candidate and Graduate Assistant in the
    <a href="https://www.cs.unlv.edu/" target="_blank">Department of Computer Science</a>
    at the <a href="https://www.unlv.edu/" target="_blank">University of Nevada, Las Vegas (UNLV)</a>,
    working in the <a href="https://github.com/unlv-evol" target="_blank">Software Evolution (EVOL) Lab</a>
    under the supervision of <a href="https://www.cs.unlv.edu/~busing/" target="_blank">Professor John Businge</a>.
    I hold an MSc in Computer Science from Makerere University, Uganda (advised by
    <a href="https://scholar.google.com/citations?user=jnFtPmIAAAAJ" target="_blank">Dr. Joyce Nakatumba-Nabende</a>
    and <a href="https://scholar.google.com/citations?user=3nyGpX4AAAAJ" target="_blank">Prof. Michel R.V. Chaudron</a>)
    and a BSc in Computer Science from Gulu University, Uganda.
    My research lies at the intersection of <strong>Empirical Software Engineering</strong> and
    <strong>Agentic AI</strong>, with publications in venues including
    ASE, EMSE, MSR, SCAM, and AIware.
    I also serve the research community on the program and artifact evaluation committees of
    top software engineering venues, including ESEC/FSE, ASE, ISSTA, ICSME, and MSR, and as a reviewer
    for journals such as ACM TOCE, Scientific Reports, and Data in Brief.
  </p>
  <p>
    <em>"And you will know the truth, and the truth will set you free."</em> — John 8:32
  </p>

