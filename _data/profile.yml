tagline: >-
  I study how software evolves, and how AI coding agents are changing the way it is built.
hero_summary: >-
  Final-year PhD Candidate in Computer Science at UNLV working on Empirical Software Engineering
  and AI for Software Engineering: patch propagation across forks, AI-generated pull requests,
  and the health of software ecosystems.

