# Content for the Teaching page.
# `years` drives the "at a glance" matrix; `terms` is the label shown on each course card.
# `about` is a one-line description of the course content (please review).

interests:
  - Software Engineering
  - Software Evolution & Maintenance
  - Empirical Software Engineering
  - AI for Software Engineering
  - Algorithms
  - Databases
  - Mobile & Web Development
  - Parallel Computing

approach:
  - icon: fas fa-diagram-project
    title: Learning by building
    text: >-
      Students learn software engineering best by shipping real products in teams. In senior design I
      coach teams through requirements, design reviews, sprints, and demos with real stakeholders.
  - icon: fas fa-flask
    title: Research in the classroom
    text: >-
      I bring findings from my own research on software evolution, refactoring, and AI coding agents
      into class, so students see how the tools they use every day are studied and improved.
  - icon: fas fa-hands-helping
    title: Mentoring
    text: >-
      I help students move from coursework to research and start-ups, a path I studied in my FAMECSE 2022
      paper on turning undergraduate capstone projects into start-ups.

