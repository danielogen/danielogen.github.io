name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC: sync Google Scholar and redeploy

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Sync Google Scholar and researchr (metrics, publications, committees)
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      continue-on-error: true
      run: |
        python3 scripts/update_scholar.py
        python3 scripts/update_researchr.py
        git add _data/metrics.yml _data/scholar_citations.yml _data/committees.yml _publications
        if ! git diff --cached --quiet; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Google Scholar and researchr data"
          git push
        fi
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.1'
        bundler-cache: true
    - name: Install and Build 🔧
      run: |
        npm install -g mermaid.cli
        bundle exec jekyll build
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

